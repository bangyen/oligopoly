name: CI

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    env:
      UV_PYTHON: ${{ matrix.python-version }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install just
        uses: extractions/setup-just@v2

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Install tooling
        run: |
          just init

      # `check` verifies formatting instead of rewriting it, so unformatted
      # code fails CI rather than being silently fixed in the runner.
      - name: Run quality checks
        run: |
          just check

  e2e:
    runs-on: ubuntu-latest
    needs: quality

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Build image and start the API
        run: |
          docker build -f deployment/Dockerfile -t oligopoly:ci .
          docker run -d --name api -p 8000:8000 oligopoly:ci
          if ! timeout 60 bash -c 'until curl -sf http://localhost:8000/healthz; do sleep 2; done'; then
            docker logs api
            exit 1
          fi

      - name: Exercise the API
        run: |
          set -euo pipefail
          post() { curl -sf -X POST "http://localhost:8000$1" -H "Content-Type: application/json" -d "$2"; }

          RUN_ID=$(post /simulate '{"model": "cournot", "rounds": 5, "params": {"a": 100.0, "b": 1.0}, "firms": [{"cost": 10.0}, {"cost": 15.0}]}' | jq -r .run_id)
          curl -sf "http://localhost:8000/runs/$RUN_ID" | jq -e '.metrics["4"].hhi'

          # Every feature at once: CES demand, a cartel, learning, market evolution
          RUN_ID=$(post /simulate '{"model": "bertrand", "rounds": 30, "seed": 1,
            "firms": [{"cost": 10}, {"cost": 10}, {"cost": 12}],
            "enhanced_demand": {"demand_type": "ces", "elasticity": 3},
            "advanced_strategies": [{"firm_id": 0, "strategy_type": "cartel"},
                                    {"firm_id": 1, "strategy_type": "cartel"},
                                    {"firm_id": 2, "strategy_type": "fictitious_play"}],
            "market_evolution": {"entry_cost": 5}}' | jq -r .run_id)
          curl -sf "http://localhost:8000/runs/$RUN_ID/events" | jq -e 'any(.events[]; .event_type == "cartel_formed")'
          curl -sf "http://localhost:8000/runs/$RUN_ID/replay" | jq -e '.total_frames == 30'

      - name: Smoke-test the dashboard
        run: |
          docker run -d --name dashboard -p 5050:5050 oligopoly:ci python dashboard/main.py
          if ! timeout 60 bash -c 'until curl -s -o /dev/null http://localhost:5050; do sleep 2; done'; then
            docker logs dashboard
            exit 1
          fi
          curl -sf http://localhost:5050/ | grep -qi "<html"
          curl -sf -X POST http://localhost:5050/api/scenario -H "Content-Type: application/json" \
            -d '{"model": "cournot", "rounds": 10, "firms": [{"cost": 10}, {"cost": 12}]}' \
            | jq -e '.run.results["9"]'

      - name: Container logs
        if: failure()
        run: |
          docker logs api || true
          docker logs dashboard || true

  packaging:
    runs-on: ubuntu-latest
    needs: quality

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Build wheel and verify it installs standalone
        run: |
          # Guards against imports that only resolve via an editable install
          # (e.g. "from src.sim..."), missing __init__.py in shipped
          # subpackages, and console scripts pointing at names that do not exist.
          uv build --wheel -o dist
          WHEEL=$(ls dist/*.whl)
          # The simulation core must work without the API extra
          uv venv /tmp/core
          uv pip install --python /tmp/core/bin/python "$WHEEL"
          /tmp/core/bin/python scripts/ci/check_wheel.py --core
          uv venv /tmp/full
          uv pip install --python /tmp/full/bin/python "$WHEEL[api]"
          /tmp/full/bin/python scripts/ci/check_wheel.py
