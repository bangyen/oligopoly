name: CI

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install just
        uses: extractions/setup-just@v2

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Install tooling
        run: |
          just init

      - name: Run quality checks
        run: |
          just all

  e2e:
    runs-on: ubuntu-latest
    needs: quality

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and start services
        run: |
          cd deployment
          docker compose up --build -d
          
      - name: Wait for services to be ready
        run: |
          echo "Waiting for services to start..."
          # Check database health
          echo "Checking database health..."
          timeout 60 bash -c 'until docker compose -f deployment/docker-compose.yml exec -T db pg_isready -U user -d oligopoly; do sleep 2; done'
          
          # Check API health
          echo "Checking API health..."
          timeout 60 bash -c 'until curl -f http://localhost:8000/healthz; do sleep 2; done'
          
          echo "All services are healthy!"

      - name: Run simulation test
        run: |
          echo "Running simulation test..."
          
          # Test basic simulation
          SIM_RESPONSE=$(curl -s -X POST "http://localhost:8000/simulate" \
            -H "Content-Type: application/json" \
            -d '{
              "model": "cournot",
              "rounds": 5,
              "params": {"a": 100.0, "b": 1.0},
              "firms": [{"cost": 10.0}, {"cost": 15.0}]
            }')
          
          echo "Simulation response: $SIM_RESPONSE"
          
          # Extract run_id
          RUN_ID=$(echo $SIM_RESPONSE | jq -r '.run_id')
          echo "Run ID: $RUN_ID"
          
          # Verify run_id is not null
          if [ "$RUN_ID" = "null" ] || [ -z "$RUN_ID" ]; then
            echo "ERROR: Failed to get run_id from simulation"
            exit 1
          fi
          
          # Test getting results
          echo "Testing results retrieval..."
          RESULTS=$(curl -s "http://localhost:8000/runs/$RUN_ID")
          echo "Results: $RESULTS"
          
          # Test heatmap generation
          echo "Testing heatmap generation..."
          HEATMAP_RESPONSE=$(curl -s -X POST "http://localhost:8000/heatmap" \
            -H "Content-Type: application/json" \
            -d '{
              "model": "cournot",
              "firm_i": 0,
              "firm_j": 1,
              "grid_size": 10,
              "action_range": [0.0, 50.0],
              "other_actions": [],
              "params": {"a": 100.0, "b": 1.0},
              "firms": [{"cost": 10.0}, {"cost": 15.0}]
            }')
          
          echo "Heatmap response: $HEATMAP_RESPONSE"
          
          # Verify heatmap was generated successfully
          if echo "$HEATMAP_RESPONSE" | jq -e '.profit_surface' > /dev/null; then
            echo "Heatmap generated successfully!"
          else
            echo "ERROR: Failed to generate heatmap"
            exit 1
          fi
          
          echo "All e2e tests passed!"

      - name: Smoke-test dashboard
        run: |
          echo "Starting FastAPI dashboard..."
          pip install -e .
          python dashboard/main.py &
          DASHBOARD_PID=$!

          # Poll until the dashboard answers instead of sleeping a fixed time
          timeout 60 bash -c 'until curl -sf http://localhost:5050 >/dev/null; do sleep 2; done'

          # Assert the page actually rendered, so this step can fail
          BODY=$(curl -sf http://localhost:5050)
          echo "$BODY" | head -c 400
          if ! echo "$BODY" | grep -qi "<html"; then
            echo "ERROR: dashboard did not return an HTML page"
            kill $DASHBOARD_PID 2>/dev/null || true
            exit 1
          fi
          echo "Dashboard smoke test passed!"

          kill $DASHBOARD_PID 2>/dev/null || true

      - name: Cleanup
        if: always()
        run: |
          cd deployment
          docker compose down -v

  packaging:
    runs-on: ubuntu-latest
    needs: quality

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Build wheel and verify it installs standalone
        run: |
          # Guards against imports that only resolve via an editable install
          # (e.g. "from src.sim..."), missing __init__.py in shipped
          # subpackages, and console scripts pointing at names that do not exist.
          uv build --wheel -o dist
          uv venv /tmp/wheelcheck
          uv pip install --python /tmp/wheelcheck/bin/python dist/*.whl
          /tmp/wheelcheck/bin/python scripts/ci/check_wheel.py
